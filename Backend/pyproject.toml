[project]
name = "maison-abeer-api"
version = "0.1.0"
description = "Maison Abeer — creative workshop admin portal API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pyjwt[crypto]>=2.10.1",
    "httpx>=0.28.1",
    "python-dateutil>=2.9.0",
    "structlog>=24.4.0",
    "slowapi>=0.1.9",
    # Ships the IANA timezone database. Required on Windows and on slim Linux
    # images, which have no system zoneinfo — without it every ZoneInfo lookup
    # raises and all scheduling breaks.
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "types-python-dateutil>=2.9.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ----------------------------------------------------------------------------
# ruff — lint + format
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # unused arguments
    "SIM",  # flake8-simplify
    "TCH",  # type-checking imports
    "PTH",  # use pathlib
    "RUF",  # ruff-specific
    "S",    # flake8-bandit (security)
    "DTZ",  # flake8-datetimez — naive datetimes are a bug in a scheduling product
]
ignore = [
    "S101",  # assert is fine in tests
    "B008",  # FastAPI Depends() in defaults is the documented idiom
]

# Typographic punctuation is used deliberately throughout the docstrings.
allowed-confusables = ["–", "—", "’", "“", "”", "…", "×"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG001", "ARG002", "TC001", "TC002", "TC003"]
"migrations/*" = ["E501", "ARG001"]
# SQLAlchemy evaluates model annotations at runtime to build the mapper, so
# moving these imports into a TYPE_CHECKING block breaks table definition.
"app/models/*" = ["TC001", "TC002", "TC003"]
# Pydantic resolves model annotations at runtime to build validators, and
# FastAPI resolves route and dependency annotations to wire injection. Both
# break if these imports are deferred to TYPE_CHECKING.
"app/schemas/*" = ["TC001", "TC002", "TC003"]
"app/api/*" = ["TC001", "TC002", "TC003"]
# The quantity parser has local variables named `token` (lexer tokens, not
# credentials), which trips the hardcoded-password heuristic.
"app/domain/quantities.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.pycodestyle]
# Allow occasional long lines in prose comments while keeping code at 100.
max-line-length = 110

# ----------------------------------------------------------------------------
# mypy — strict
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "slowapi.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --cov=app --cov-report=term-missing"
markers = [
    "integration: requires a live database connection",
]

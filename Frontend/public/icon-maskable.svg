<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Maison Abeer">
  <!--
    The maskable variant. Android crops this to a circle, a squircle or a
    rounded square depending on the launcher, so everything meaningful sits
    inside the middle 80% — the same mark as icon.svg at 0.8 scale, on a
    background that bleeds to all four edges.
  -->
  <rect width="512" height="512" fill="#FFF8F0"/>
  <g transform="translate(256 256) scale(0.8) translate(-256 -256)">
    <circle cx="256" cy="256" r="176" fill="none" stroke="#E2849E" stroke-width="26"/>
    <circle cx="256" cy="256" r="116" fill="#FBE7EA"/>
    <circle cx="256" cy="256" r="116" fill="none" stroke="#F2AABE" stroke-width="14"/>
    <circle cx="256" cy="256" r="46" fill="#C25B78"/>
  </g>
</svg>
